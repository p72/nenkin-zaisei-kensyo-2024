# 現行制度（2024年財政検証）の種
# ==================================
# 値ごとに移植版の行を `source: dir/file.py:LINE` で引く。`tests/test_policy_seed.py` が
#   - `port:`  があれば、その属性（`system.module.NAME[idx]`）の値と一致すること
#   - なければ `match:`（省略時は値の文字列）が `source:` の行に書かれていること
# を全項目で確かめる。移植版は読み取り専用。
#
# 単位の約束: 金額は円（2004年度価格と書いたものはその価格）、率は小数、年度は西暦。
# 移植版が「西暦−2000」で持つものは西暦に直して書き、`match:` に移植版の表記を残す。
#
# 原本の癖（`検証/原本の不具合.md` の J1・J2・J3・B11）は**原本どおり**を既定にする（2026-09-29 の利用者の
# 決定。公表値の再現を既定にし、引用されたときに「厚労省の計算と違う」と読まれないように）。
# 意図どおりに直した値は overlay `options/fix_bugs.yaml`（`load_policy("fix_bugs")`）で重ねる。

meta:
  name: {value: "2024年財政検証・現行制度", source: "kosoku/policy/base_2024.yaml:1", note: "この yaml 自身"}
